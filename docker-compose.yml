name: automatic-course

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ac-backend
    restart: unless-stopped
    env_file: .env
    environment:
      - APP_ENV=${APP_ENV:-production}
      # WSLg display passthrough: Chromium headful s'affiche sur le bureau Windows.
      - DISPLAY=${DISPLAY:-:0}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-wayland-0}
      - XDG_RUNTIME_DIR=/tmp/runtime-root
      - PULSE_SERVER=${PULSE_SERVER:-/mnt/wslg/PulseServer}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      # Live-mount du code: pas besoin de rebuild à chaque modif Python.
      - ./backend/app:/app/app
      # WSLg sockets (X11 + Wayland) — montés en lecture seule
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /mnt/wslg:/mnt/wslg
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8001/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8001}
    container_name: ac-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
